<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
</head>
<body>
    <!-- Header -->
    <header class="bg-blue-950 text-white px-4 flex items-center justify-between border-b-2 border-blue-900">
      <!-- Left: sidebar toggle + logo -->
      <div class="flex items-center gap-4">
        <button id="sidebarToggle" class="text-white hover:text-gray-200 transition text-xl">
          <i class="fas fa-bars"></i>
        </button>

        <div class="bg-white text-blue-950 px-3 py-1 rounded font-bold text-sm">
          Logo
        </div>
      </div>

      <!-- Right: actions (no bell), status and avatar -->
      <div class="flex items-center">
        <button class="text-white hover:text-gray-200 transition px-2 py-1 rounded">
          <i class="fas fa-th-large"></i>
        </button>

        <button class="text-white hover:text-gray-200 transition px-2 py-1 rounded">
          <i class="fas fa-sliders-h"></i>
        </button>

        <div class="relative flex items-center gap-2 cursor-pointer px-3 py-2 rounded transition group">
          <div class="flex items-center border border-white rounded-[6px] px-2 py-1 hover:bg-blue-900 transition-colors duration-200">
            <span class="w-3 h-3 bg-green-500 rounded-full mr-2 flex-shrink-0 self-center"></span>
            <span class="font-medium">Available</span>
            <span class="mx-0.5 self-center">|</span>
            <span class="text-gray-300">10:27</span>
          </div>
          <i class="fas fa-chevron-down text-xs text-gray-300 group-hover:text-white"></i>
          <img src="https://via.placeholder.com/32" alt="User" class="w-8 h-8 rounded-full" />
        </div>
      </div>
    </header>

    <div class="flex">
      <!-- Sidebar (vertical icons) -->
      <aside id="sidebar" class="w-12 bg-white/5 border-r border-blue-900 min-h-screen flex flex-col items-center gap-2 px-2">
        <button class="text-black hover:text-[#0263E0] p-1 rounded-md" aria-label="Dashboard">
          <i class="fas fa-toggle-on text-sm"></i>
        </button>

        <button class="text-black hover:text-[#0263E0] p-1 rounded-md" aria-label="Modules">
          <i class="fas fa-layer-group text-sm"></i>
        </button>

        <button class="text-black hover:text-[#0263E0] p-1 rounded-md" aria-label="Assets">
          <i class="fas fa-cubes text-sm"></i>
        </button>

        <button class="text-black hover:text-[#0263E0] p-1 rounded-md" aria-label="Contacts">
          <i class="fas fa-users text-sm"></i>
        </button>

        <button class="text-black hover:text-[#0263E0] p-1 rounded-md" aria-label="Devices">
          <i class="fas fa-desktop text-sm"></i>
        </button>

        <button class="text-black hover:text-[#0263E0] p-1 rounded-md" aria-label="Analytics">
          <i class="fas fa-chart-line text-sm"></i>
        </button>

        <button class="text-black hover:text-[#0263E0] p-1 rounded-md" aria-label="Accounts">
          <i class="fas fa-building-columns text-sm"></i>
        </button>

        <button class="text-black hover:text-[#0263E0] p-1 rounded-md" aria-label="Files">
          <i class="fas fa-file-lines text-sm"></i>
        </button>

        <button class="text-black hover:text-[#0263E0] p-1 rounded-md" aria-label="Profile">
          <i class="fas fa-user text-sm"></i>
        </button>

        <button class="text-black hover:text-[#0263E0] p-1 rounded-md" aria-label="Calls">
          <i class="fas fa-phone text-sm"></i>
        </button>

        <button class="text-black hover:text-[#0263E0] p-1 rounded-md" aria-label="Compose">
          <i class="fas fa-pen-to-square text-sm"></i>
        </button>
      </aside>
      <!--done-->>

      <!-- Main Content -->
      <main class="flex-1 p-6">
        <!-- Thêm nội dung chính tại đây -->
      </main>
    </div>
  </body>
